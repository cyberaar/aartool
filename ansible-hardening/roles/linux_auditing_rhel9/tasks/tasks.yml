---
- name: "Ensure auditd packages are installed"
  ansible.builtin.package:
    name:
      - "audit"
      - "audit-libs"
    state: "present"

- name: "Deploy auditd.conf template"
  ansible.builtin.template:
    src: "auditd.conf.j2"
    dest: "{{ linux_auditd_conf_file }}"
    mode: "0640"
    owner: "root"
    group: "root"
    backup: true
  register: "auditd_conf_result"
  notify: "Restart auditd"

- name: "Deploy CIS audit rules template"
  ansible.builtin.template:
    src: "99-cis-audit.rules.j2"
    dest: "{{ linux_auditd_rules_file }}"
    mode: "0640"
    owner: "root"
    group: "root"
    backup: true
  register: "audit_rules_result"
  notify: "Restart auditd"

- name: "Enable and start auditd service"
  when: "not ansible_check_mode or 'auditd.service' in (aartool_units | default(''))"
  ansible.builtin.service:
    name: "auditd"
    state: "started"
    enabled: true
  failed_when: false

- name: "Check if GRUB config exists"
  ansible.builtin.stat:
    path: "/etc/default/grub"
  register: "_grub_file"

- name: "Enable boot-time auditing in GRUB if configured"
  when:
    - "linux_auditd_enable_boot_auditing | bool"
    - "_grub_file.stat.exists"
  ansible.builtin.lineinfile:
    path: "/etc/default/grub"
    regexp: "^GRUB_CMDLINE_LINUX="
    line: "GRUB_CMDLINE_LINUX=\"audit=1\""
    backrefs: true
  register: "grub_audit_result"

- name: "Rebuild GRUB config if boot auditing enabled"
  when:
    - "_grub_file.stat.exists"
    - "grub_audit_result.changed | default(false)"
  ansible.builtin.command: "grub2-mkconfig -o /boot/grub2/grub.cfg"
  changed_when: true

# Optional debug / notice
- name: "Notify about potential reboot for boot auditing" # noqa: no-handler
  when: "grub_audit_result.changed | default(false)"
  ansible.builtin.debug:
    msg: "Boot-time auditing changes applied. Reboot required for full effect if GRUB was modified."

- name: "Enable auditd syslog plugin if forwarding to local rsyslog requested"
  when:
    - "linux_auditd_forward_to_syslog | bool"
    - "not linux_auditing_forwarding_disabled | bool"
  ansible.builtin.lineinfile:
    path: "{{ linux_auditd_syslog_plugin_path }}"
    regexp: "^active ="
    line: "active = {{ linux_auditd_syslog_plugin_active }}"
    mode: "0640"
  notify: "Restart auditd"

- name: "Ensure rsyslog is installed and enabled"
  ansible.builtin.package:
    name: "rsyslog"
    state: "present"

- name: "Enable and start rsyslog service"
  when: "not ansible_check_mode or 'rsyslog.service' in (aartool_units | default(''))"
  ansible.builtin.service:
    name: "rsyslog"
    state: "started"
    enabled: true
  failed_when: false

- name: "Deploy rsyslog remote forwarding configuration (TCP/TLS/RELP)"
  when:
    - "linux_rsyslog_forward_enabled | bool"
    - "linux_rsyslog_remote_host != ''"
    - "not linux_auditing_forwarding_disabled | bool"
  ansible.builtin.template:
    src: "rsyslog-remote-forward.j2"
    dest: "/etc/rsyslog.d/10-audit-remote-forward.conf"
    mode: "0640"
    owner: "root"
    group: "root"
    backup: true
  register: "rsyslog_forward_result"
  notify:
    - "Restart rsyslog"
    - "Restart auditd" # ensure audit events flow through if plugin active

# Optional: disk queue directory
- name: "Create rsyslog disk queue directory if enabled"
  when: "linux_rsyslog_queue_disk | bool and linux_rsyslog_forward_enabled | bool"
  ansible.builtin.file:
    path: "{{ linux_rsyslog_queue_file | dirname }}"
    state: "directory"
    mode: "0700"
    owner: "root"
    group: "root"

# ── Verify the rules actually loaded ─────────────────────────────────────────
# Writing the rules file is not the same as loading it, and nothing above would
# notice the difference. `augenrules` stops at the first rule the running kernel
# rejects (an unknown syscall, a `-F dir=` whose directory is absent), leaving a
# PARTIAL and still-MUTABLE ruleset. That failure is swallowed three times over:
# auditd's own ExecStartPost carries a leading `-`, the "Restart auditd" handler
# sets `failed_when: false`, and the template task only reports that the file
# changed. A host can therefore report a clean hardening run while auditing a
# fraction of what the benchmark asks for. Check it explicitly and fail loudly.
- name: "Flush handlers so auditd has restarted before the ruleset is checked"
  ansible.builtin.meta: "flush_handlers"

- name: "Read the running audit ruleset state"
  ansible.builtin.command: "auditctl -s"
  register: "_linux_auditd_state"
  changed_when: false
  failed_when: false
  check_mode: false

# Once a ruleset ending in `-e 2` has loaded, the kernel refuses every further
# change until reboot and augenrules exits non-zero. That is the configured
# end state, not a fault, so report it instead of failing the run.
- name: "Load the audit rules"
  when:
    - "not ansible_check_mode"
    - "'enabled 2' not in (_linux_auditd_state.stdout | default(''))"
  ansible.builtin.command: "augenrules --load"
  register: "_linux_auditd_load"
  changed_when: "'No change' not in (_linux_auditd_load.stdout | default(''))"
  failed_when: false

# Two different things make this exit non-zero and they deserve different
# answers. A REJECTED RULE names itself on stderr ("Syscall name unknown",
# "There was an error in line N") and is the fault this check exists for: the
# load stopped there, so the rest of the file never applied. An UNAVAILABLE
# AUDIT SUBSYSTEM -- a container without CAP_AUDIT_CONTROL, a kernel built
# without audit -- exits non-zero with stdout and stderr both empty. Failing on
# the second would make the role unusable in a container while telling us
# nothing, so it is reported instead, loudly enough that nobody reads it as
# success.
- name: "Fail when augenrules rejected a rule"
  when:
    - "not ansible_check_mode"
    - "_linux_auditd_load is not skipped"
  ansible.builtin.assert:
    that:
      - "'Syscall name unknown' not in (_linux_auditd_load.stderr | default(''))"
      - "'There was an error in line' not in (_linux_auditd_load.stderr | default(''))"
    fail_msg: >-
      augenrules rejected a rule and stopped at it, so the rest of
      {{ linux_auditd_rules_file }} -- including the closing `-e 2` that makes
      the ruleset immutable -- did not load:
      {{ _linux_auditd_load.stderr | default('') | trim }}

- name: "Report that the ruleset did not load, with no rule named"
  when:
    - "not ansible_check_mode"
    - "_linux_auditd_load is not skipped"
    - "_linux_auditd_load.rc | default(0) != 0"
    - "'Syscall name unknown' not in (_linux_auditd_load.stderr | default(''))"
    - "'There was an error in line' not in (_linux_auditd_load.stderr | default(''))"
  ansible.builtin.debug:
    msg: >-
      NOT ACTIVE: augenrules exited {{ _linux_auditd_load.rc }} without naming a
      rejected rule, so {{ linux_auditd_rules_file }} is on disk but is NOT
      loaded. The audit subsystem is typically unavailable to an unprivileged
      container. On a real host, treat this as a fault.
      stderr: {{ _linux_auditd_load.stderr | default('') | trim | default('(empty)', true) }}

- name: "Report that the ruleset is immutable and a reboot is needed to change it"
  when:
    - "not ansible_check_mode"
    - "'enabled 2' in (_linux_auditd_state.stdout | default(''))"
  ansible.builtin.debug:
    msg: >-
      The audit ruleset is immutable (-e 2). {{ linux_auditd_rules_file }} is on
      disk and takes effect at the next reboot.
