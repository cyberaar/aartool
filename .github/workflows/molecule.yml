---
name: Molecule Tests

on:
  push:
    branches: [main]
    paths:
      - "ansible-hardening/**"
      - ".github/workflows/molecule.yml"
  pull_request:
    branches: [main]
    paths:
      - "ansible-hardening/**"
      - ".github/workflows/molecule.yml"
  workflow_dispatch:

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible-hardening/requirements-dev.txt

      - name: Install Python dependencies
        run: pip install ansible-core==2.20.2 ansible-lint==26.3.0

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r ansible-hardening/requirements.yml

      - name: Run ansible-lint
        working-directory: ansible-hardening
        run: ansible-lint roles/ playbooks/

      # What actually ends up in the published tarball. build_ignore had four
      # entries and none of them worked, so v3.5.3 shipped a real inventory,
      # a real host's audit report and a vendored copy of itself.
      - name: The collection tarball contains only what it should
        run: bash scripts/tests/test_collection_build.sh

  molecule:
    name: ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - ssh_hardening
          - authselect_rhel9
          - apparmor_ubuntu
          - fail2ban_ubuntu
          - auditing_ubuntu
          - auditing_rhel9
          - selinux_rhel9
          - kernel_hardening
          - firewall
          - chrony
          - login_banner
          - cron_hardening
          - ctrl_alt_del
          - ip_forwarding
          - tmp_mounts
          - core_dumps
          - disable_services
          - file_permissions
          - sudo_hardening
          - user_management
          - wireless
          - authselect_ubuntu
          - fail2ban_rhel9
          - dnf_automatic
          - unattended_upgrades
          - aide
          - crypto_policies
          - secure_boot
          - bootloader_password
          - ipv6
          - journald

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ansible-hardening/requirements-dev.txt

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install \
            ansible-core==2.20.2 \
            molecule==26.3.0 \
            molecule-docker==2.1.0 \
            ansible-lint==26.3.0 \
            docker==7.1.0

      # molecule-docker 2.1.0 ships string conditionals incompatible with
      # ansible-core 2.20's stricter when: evaluation.
      # Patch: wrap lookup result with | length > 0 so it evaluates as bool.
      - name: Patch molecule-docker for ansible-core 2.20
        run: |
          PKGS=$(python -c "import site; print(site.getsitepackages()[0])")
          for f in create.yml destroy.yml; do
            sed -i \
              "s/when: (lookup('env', 'HOME'))/when: (lookup('env', 'HOME') | length > 0)/g" \
              "$PKGS/molecule_docker/playbooks/$f"
          done

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install -r ansible-hardening/requirements.yml
          ansible-galaxy collection install "community.docker:>=3.0.0"

      # Authenticate to avoid Docker Hub anonymous pull rate limit (100/6 h).
      # Set DOCKERHUB_USERNAME and DOCKERHUB_TOKEN in repo Settings → Secrets → Actions.
      # Step is skipped gracefully if the secrets are not configured.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run Molecule — ${{ matrix.scenario }}
        working-directory: ansible-hardening
        env:
          PY_COLORS: "1"
          ANSIBLE_FORCE_COLOR: "1"
        run: molecule test -s ${{ matrix.scenario }}
