---
name: Baseline Build Check

on:
  push:
    branches: [main]
    paths:
      - "scripts/src/**"
      - "scripts/build.sh"
      - "scripts/run-hardening.sh"
      - "dashboard/**"
      - "ansible-hardening/playbooks/**"
      - "ansible-hardening/roles/*/defaults/**"
      - "scripts/aartool-baseline.sh"
      - ".github/workflows/baseline-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "scripts/src/**"
      - "scripts/build.sh"
      - "scripts/run-hardening.sh"
      - "dashboard/**"
      - "ansible-hardening/playbooks/**"
      - "ansible-hardening/roles/*/defaults/**"
      - "scripts/aartool-baseline.sh"
      - ".github/workflows/baseline-build.yml"
  workflow_dispatch:

jobs:
  build:
    name: baseline-build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Run build.sh
        run: bash scripts/build.sh

      - name: Verify bundle is in sync with src/
        run: |
          if ! git diff --exit-code scripts/aartool-baseline.sh; then
            echo ""
            echo "ERROR: aartool-baseline.sh is out of sync with src/."
            echo "Run 'bash scripts/build.sh' locally and commit the result."
            exit 1
          fi

      - name: Verify check count
        run: |
          COUNT=$(grep -oh '"[A-Z]\{2,4\}-[0-9]\{2\}"' scripts/aartool-baseline.sh | sort -u | wc -l)
          echo "Unique check IDs in bundle: $COUNT"
          if [[ "$COUNT" -lt 90 ]]; then
            echo "ERROR: Fewer than 90 unique checks found — build may be corrupt."
            exit 1
          fi
          echo "Check count OK: $COUNT"

      - name: Verify bash syntax
        run: bash -n scripts/aartool-baseline.sh

      # Coverage we cannot get any other way: CI runs on Ubuntu and Molecule
      # tests Rocky 9 and Ubuntu 22.04, so nothing in the pipeline ever executes
      # on openSUSE, Alpine, Arch or Amazon Linux. These feed the mapping their
      # real /etc/os-release and assert the answer.
      # Neither the baseline nor run-hardening.sh was linted. That is how a typo
      # split ${RING_COLORALPHA} into ${RING_COLOR}ALPHA and shipped invalid CSS
      # into every HTML report, silently, because browsers drop a bad filter
      # without complaining. shellcheck reported it as an unused variable.
      - name: Shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck -S warning scripts/aartool-baseline.sh
          shellcheck -S warning scripts/run-hardening.sh

      - name: Distribution mapping tests
        run: bash scripts/tests/test_distro.sh

      # The plan printed at the end of every audit is built from ANSIBLE_MAP.
      # Nothing verified those tags and roles existed, so a typo produced a
      # command that runs cleanly, matches nothing and changes nothing, while
      # the operator believes the finding is remediated.
      - name: Remediation map points at real tags and roles
        run: bash scripts/tests/test_remediation_map.sh

      # The audit script was at 4.2.0 while every JSON report it wrote claimed
      # 4.0.0, because the renderer had the number typed in as a literal.
      # Numbers that must agree, agree here or the build fails.
      - name: Versions agree across sources, bundles, reports and the image tag
        run: bash scripts/tests/test_versions.sh

      # SYS-10 tested for Ctrl-Alt-Del masking with `systemctl is-masked`, a verb
      # systemd does not have, so it reported FAIL on every host ever scanned.
      # Subcommands the checks invoke are validated against the real tool's help.
      - name: Checks call subcommands that exist
        run: bash scripts/tests/test_check_commands.sh

      - name: Reachability waves agree between the engine and advise
        run: bash scripts/tests/test_waves.sh

      - name: Every check carries a French name
        run: bash scripts/tests/test_french_names.sh

      # `aartool plan` runs the playbook with --check, which installs nothing,
      # so a role that installs a package and then starts its service hits a
      # unit that is not there. Reported twice by users, for ufw and for ssh,
      # with 40 unguarded service tasks at the time.
      - name: Service tasks survive check mode
        run: bash scripts/tests/test_service_guards.sh

      # The dashboard mirrors advise's wave ordering because it has no shell to
      # call, and `aartool report --out` injects into it by function name. Both
      # are places two things must agree with nothing checking that they do.
      # Explicit rather than relying on the runner image happening to ship node:
      # without it the dashboard render assertion silently SKIPs, and a guard
      # that skips is a guard that is not there.
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "20"

      - name: Dashboard matches advise, renders, and reaches no network
        run: bash scripts/tests/test_dashboard.sh

      - name: Escaping regression tests
        run: bash scripts/tests/test_escaping.sh
